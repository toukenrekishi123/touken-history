<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>刀剣歴史帳・本丸</title>
<style>
:root{--bg:#171a1d;--panel:#24292e;--panel2:#30363b;--gold:#d8b76a;--text:#f5f2e9;--muted:#b8b4aa;--red:#9e514b;--green:#557b5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#15181b,#252a2e);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh}
header{padding:24px 16px 16px;text-align:center;background:linear-gradient(180deg,#101214,#292e33);border-bottom:1px solid #4b4e50}
header h1{font-size:25px;margin:0;letter-spacing:3px}
header p{margin:6px 0 0;color:var(--muted);font-size:12px}
nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:8px;background:#111416;border-bottom:1px solid #41464a}
nav button{border:1px solid #50565a;background:#252a2e;color:#ddd;border-radius:8px;padding:10px 13px;white-space:nowrap;font-weight:700}
nav button.active{background:#d0b064;color:#171717;border-color:#e3ca85}
main{max-width:760px;margin:auto;padding:14px}
.page{display:none}.page.active{display:block}
.panel{background:linear-gradient(145deg,#292e33,#202428);border:1px solid #454b4f;border-radius:14px;padding:16px;margin-bottom:13px;box-shadow:0 7px 20px #0005}
h2{margin:0 0 10px;font-size:19px}.muted{color:var(--muted);font-size:12px;line-height:1.7}
.koban{color:#e7ca78;font-weight:800}.rank{color:#d9bb69;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.btn{width:100%;border:1px solid #62686b;border-radius:10px;padding:12px;background:#343a3f;color:white;font-weight:700;font-size:14px}
.btn:active{transform:scale(.98)}.btn.gold{background:#b08c3d;color:#171717;border-color:#e0c477}.btn.red{background:#633b39}
.stat{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #3e4448;font-size:13px}
.stat:last-child{border-bottom:0}
.bar{height:9px;background:#101214;border-radius:99px;overflow:hidden;border:1px solid #454a4e}.fill{height:100%;background:linear-gradient(90deg,#a57f35,#ead080);width:0%;transition:.4s}
.stage{border:1px solid #4b5155;border-radius:12px;padding:14px;margin:8px 0;background:#292f34}
.stage.locked{opacity:.45}.stage h3{margin:0 0 5px}.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:#454b4f;margin:2px}
.sword{display:flex;align-items:center;gap:12px;border:1px solid #4b5155;border-radius:12px;padding:12px;margin:8px 0;background:#292e33}
.icon{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#15181a;border:1px solid #6a5a35;font-size:22px}
.sword b{font-size:15px}.small{font-size:11px;color:var(--muted)}
.choice{width:100%;text-align:left;border:1px solid #555c60;border-radius:10px;padding:12px;margin:5px 0;background:#30363b;color:#fff;font-size:14px}
.choice.correct{background:#426048;border-color:#86ad8c}.choice.wrong{background:#633b39;border-color:#bd7b74}
.notice{padding:11px;border-left:3px solid var(--gold);background:#24282b;color:#ddd;font-size:12px;line-height:1.7}
.result{text-align:center;font-size:30px;font-weight:900;color:#e0c274}
.hidden{display:none!important}
@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:10px}}
</style>
</head>
<body>
<header>
<h1>⚔ 刀剣歴史帳</h1>
<p>中学歴史 × 刀剣男士 × 出陣学習</p>
</header>
<nav>
<button class="active" onclick="page('home',this)">本丸</button>
<button onclick="page('map',this)">出陣</button>
<button onclick="page('swords',this)">刀帳</button>
<button onclick="page('people',this)">人物帳</button>
</nav>
<main>

<section id="home" class="page active">
<div class="panel">
<h2>🏯 本丸</h2>
<div class="stat"><span>審神者レベル</span><b id="level">1</b></div>
<div class="stat"><span>歴史経験値</span><b><span id="xp">0</span> / <span id="nextxp">100</span></b></div>
<div class="bar"><div class="fill" id="xpbar"></div></div>
<div class="stat"><span>小判</span><b class="koban" id="koban">300</b></div>
<div class="stat"><span>戦績ランク</span><b class="rank" id="rank">E</b></div>
</div>
<div class="panel">
<h2>📜 今日の任務</h2>
<div class="grid">
<button class="btn gold" onclick="page('map',document.querySelectorAll('nav button')[1])">⚔ 出陣する</button>
<button class="btn" onclick="page('swords',document.querySelectorAll('nav button')[2])">🗡 刀帳を見る</button>
<button class="btn" onclick="page('people',document.querySelectorAll('nav button')[3])">👤 人物帳</button>
<button class="btn" onclick="daily()">🎯 今日の一問</button>
</div>
<div id="dailyBox" class="muted" style="margin-top:10px"></div>
</div>
<div class="panel">
<h2>📝 学習メモ</h2>
<div class="notice">このゲームでは、刀剣乱舞のキャラクターを「歴史を覚える入口」として使います。ゲーム設定と史実は同一ではありません。史実に諸説があるものは断定を避けます。</div>
</div>
</section>

<section id="map" class="page">
<div class="panel">
<h2>🗺️ 出陣先</h2>
<p class="muted">ステージをクリアすると次の時代が解放されます。問題は中学歴史を中心にしています。</p>
<div id="stageList"></div>
</div>
</section>

<section id="battle" class="page">
<div class="panel">
<div class="tag" id="battleEra"></div>
<h2 id="battleTitle"></h2>
<div class="stat"><span>歴史経験値</span><b id="battleXP">0</b></div>
<div id="battleBox"></div>
</div>
</section>

<section id="swords" class="page">
<div class="panel"><h2>🗡️ 刀帳</h2><p class="muted">解放した刀剣男士は詳細を確認できます。</p><div id="swordList"></div></div>
</section>

<section id="people" class="page">
<div class="panel"><h2>👤 人物帳</h2><p class="muted">「何年ごろ・何をした人か」をセットで覚えよう。</p><div id="peopleList"></div></div>
</section>

</main>

<script>
const stages=[
{id:0,era:"飛鳥",title:"飛鳥・大陸交流",need:0,xp:40,people:["聖徳太子"],sword:"今剣",qs:[
["聖徳太子が定めたとされるものは？",["十七条の憲法","武家諸法度","御成敗式目","五箇条の御誓文"],0],
["聖徳太子が派遣した使節は？",["遣唐使","遣隋使","遣明使","岩宿使"],1],
["飛鳥時代の政治で重要な人物は？",["聖徳太子","徳川家康","伊藤博文","足利義満"],0]
]},
{id:1,era:"奈良",title:"奈良・律令国家",need:30,xp:45,people:["聖武天皇"],sword:"三日月宗近",qs:[
["奈良時代の都は？",["平城京","平安京","鎌倉","江戸"],0],
["聖武天皇が建立を進めた寺は？",["東大寺","金閣","延暦寺","中尊寺"],0],
["奈良の大仏がある寺は？",["東大寺","法隆寺","清水寺","金閣寺"],0]
]},
{id:2,era:"平安",title:"平安・武士の成長",need:70,xp:50,people:["藤原道長","平清盛"],sword:"三日月宗近",qs:[
["794年に都が移された場所は？",["平安京","平城京","長岡京","鎌倉"],0],
["摂関政治で栄えた一族は？",["藤原氏","源氏","北条氏","徳川氏"],0],
["平氏政権を築いた人物は？",["平清盛","源頼朝","足利尊氏","豊臣秀吉"],0]
]},
{id:3,era:"鎌倉",title:"鎌倉・武士の政治",need:120,xp:55,people:["源頼朝","北条氏"],sword:"今剣",qs:[
["鎌倉幕府を開いた人物は？",["源頼朝","足利義満","徳川家康","織田信長"],0],
["将軍と御家人の関係を表す言葉は？",["御恩と奉公","楽市楽座","班田収授","参勤交代"],0],
["元寇のうち、1274年の戦いは？",["文永の役","弘安の役","応仁の乱","承久の乱"],0]
]},
{id:4,era:"室町",title:"室町・戦国への道",need:180,xp:60,people:["足利尊氏","足利義満"],sword:"堀川国広",qs:[
["室町幕府を開いた人物は？",["足利尊氏","源頼朝","織田信長","徳川家康"],0],
["日明貿易で使われた証明札は？",["勘合","朱印状","御成敗式目","刀狩令"],0],
["応仁の乱の後に広がった時代は？",["戦国時代","奈良時代","飛鳥時代","明治時代"],0]
]},
{id:5,era:"安土桃山",title:"天下統一",need:250,xp:65,people:["織田信長","豊臣秀吉"],sword:"燭台切光忠",qs:[
["楽市楽座を進めた人物は？",["織田信長","徳川家康","源頼朝","北条時宗"],0],
["全国統一を完成させた人物は？",["豊臣秀吉","足利義満","平清盛","西郷隆盛"],0],
["豊臣秀吉が行った政策は？",["刀狩","参勤交代","廃藩置県","五箇条の御誓文"],0]
]},
{id:6,era:"江戸",title:"江戸・幕藩体制",need:330,xp:70,people:["徳川家康","徳川吉宗"],sword:"大倶利伽羅",qs:[
["江戸幕府を開いた人物は？",["徳川家康","徳川吉宗","豊臣秀吉","織田信長"],0],
["大名を江戸と領地に交代で住まわせた制度は？",["参勤交代","班田収授","御恩と奉公","廃藩置県"],0],
["享保の改革を行った将軍は？",["徳川吉宗","徳川家康","徳川慶喜","徳川綱吉"],0]
]},
{id:7,era:"幕末・明治",title:"幕末から近代国家へ",need:420,xp:80,people:["西郷隆盛","大久保利通"],sword:"和泉守兼定",qs:[
["江戸幕府が政権を朝廷に返したことを何という？",["大政奉還","廃藩置県","版籍奉還","文明開化"],0],
["明治政府が藩を廃止して府県を置いた改革は？",["廃藩置県","地租改正","徴兵令","学制"],0],
["新選組副長として知られる人物は？",["土方歳三","伊藤博文","大久保利通","西郷隆盛"],0]
]}
];

const swords=[
["三日月宗近","平安","三条宗近","平安時代の刀工・三条宗近の作とされる。天下五剣の一つ。"],
["燭台切光忠","戦国〜江戸","光忠（長船派）","伊達家伝来の刀として知られる。"],
["実休光忠","戦国","光忠（長船派）","名は三好実休とのつながりから付けられたとされる。"],
["和泉守兼定","幕末","兼定","土方歳三が愛用したとされる刀として知られる。"],
["堀川国広","安土桃山","堀川国広","安土桃山時代の刀工・堀川国広の作として知られる脇差。"],
["大倶利伽羅","江戸まで","相州伝・広光作とされる","伊達家伝来。倶利伽羅竜王の彫り物がある。"],
["山姥切国広","安土桃山","堀川国広","霊剣『山姥切』を模して造られたとされる打刀。"],
["篭手切江","中世〜近世","江の刀工系","脇差。刀工・伝来・所蔵者を分けて覚えるのがポイント。"]
];

const people=[
["聖徳太子","飛鳥","冠位十二階・十七条の憲法・遣隋使"],
["聖武天皇","奈良","東大寺の大仏など、仏教を重視した政治"],
["藤原道長","平安","摂関政治で権力を握った"],
["平清盛","平安","武士として初めて太政大臣になり、平氏政権を築いた"],
["源頼朝","鎌倉","鎌倉幕府を開いた"],
["足利尊氏","室町","室町幕府を開いた"],
["織田信長","安土桃山","楽市楽座などを進め、天下統一を目指した"],
["豊臣秀吉","安土桃山","全国統一、検地・刀狩を行った"],
["徳川家康","江戸","江戸幕府を開いた"],
["徳川吉宗","江戸","享保の改革を行った"],
["土方歳三","幕末","新選組副長として活動した"],
["西郷隆盛","明治","明治維新で活躍した人物"]
];

let state=JSON.parse(localStorage.getItem("rekishiGame")||'{"xp":0,"koban":300,"cleared":[],"swords":[],"rank":"E"}');
let currentStage=null,currentQ=0,currentCorrect=0;

function save(){localStorage.setItem("rekishiGame",JSON.stringify(state));updateHome();}
function level(){return Math.floor(state.xp/100)+1}
function updateHome(){
document.getElementById("level").textContent=level();
let next=level()*100, prev=(level()-1)*100;
document.getElementById("xp").textContent=state.xp;
document.getElementById("nextxp").textContent=next;
document.getElementById("xpbar").style.width=Math.min(100,((state.xp-prev)/(next-prev))*100)+"%";
document.getElementById("koban").textContent=state.koban;
state.rank=state.xp>=500?"S":state.xp>=300?"A":state.xp>=150?"B":state.xp>=50?"C":"E";
document.getElementById("rank").textContent=state.rank;
}

function page(id,btn){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
if(btn)btn.classList.add("active");
if(id==="map")renderStages();
if(id==="swords")renderSwords();
if(id==="people")renderPeople();
window.scrollTo({top:0,behavior:"smooth"});
}

function renderStages(){
document.getElementById("stageList").innerHTML=stages.map((s,i)=>{
let unlocked=state.xp>=s.need,cleared=state.cleared.includes(s.id);
return `<div class="stage ${unlocked?"":"locked"}">
<span class="tag">${s.era}</span><span class="tag">${cleared?"攻略済み":"未攻略"}</span>
<h3>${s.title}</h3>
<div class="small">推奨歴史力：${s.need}　報酬：経験値 ${s.xp}・小判 ${50+i*10}</div>
<button class="btn ${unlocked?"gold":"red"}" style="margin-top:9px" ${unlocked?`onclick="startStage(${s.id})"`:"disabled"}>
${unlocked?"⚔ 出陣する":"🔒 未開放"}
</button></div>`;
}).join("");
}

function startStage(id){
currentStage=stages.find(x=>x.id===id);currentQ=0;currentCorrect=0;
document.getElementById("battleEra").textContent=currentStage.era;
document.getElementById("battleTitle").textContent="⚔️ "+currentStage.title;
document.getElementById("battleXP").textContent=currentStage.xp;
page("battle",null);renderBattle();
}

function renderBattle(){
let s=currentStage,q=s.qs[currentQ];
document.getElementById("battleBox").innerHTML=`
<p class="quiz-question"><b>第${currentQ+1}問 / ${s.qs.length}</b><br>${q[0]}</p>
${q[1].map((a,i)=>`<button class="choice" onclick="answer(${i},this)">${a}</button>`).join("")}
<p class="muted">⚔️ 関連刀剣：${s.sword}</p>`;
}

function answer(i,btn){
let q=currentStage.qs[currentQ],buttons=document.querySelectorAll(".choice");
buttons.forEach(b=>b.disabled=true);
if(i===q[2]){btn.classList.add("correct");currentCorrect++}
else{btn.classList.add("wrong");buttons[q[2]].classList.add("correct")}
setTimeout(()=>{
currentQ++;
if(currentQ<currentStage.qs.length)renderBattle();
else finishStage();
},650);
}

function finishStage(){
let s=currentStage,score=currentCorrect/s.qs.length;
let bonus=score===1?25:score>=.66?15:5;
let first=!state.cleared.includes(s.id);
let gain=first?s.xp+bonus:bonus;
let coins=first?50+s.id*10:10;
state.xp+=gain;state.koban+=coins;
if(first)state.cleared.push(s.id);
if(s.sword && !state.swords.includes(s.sword))state.swords.push(s.sword);
save();
let rank=score===1?"S":score>=.66?"A":score>=.33?"B":"C";
document.getElementById("battleBox").innerHTML=`
<div class="result">完全勝利 ${rank}!</div>
<p style="text-align:center">正解 ${currentCorrect} / ${s.qs.length}</p>
<div class="stat"><span>獲得経験値</span><b>+${gain}</b></div>
<div class="stat"><span>獲得小判</span><b class="koban">+${coins}</b></div>
<div class="notice" style="margin-top:10px">次の出陣先は、必要な歴史力を満たすと解放されます。</div>
<button class="btn gold" style="margin-top:10px" onclick="page('map',document.querySelectorAll('nav button')[1])">出陣先へ戻る</button>`;
}

function renderSwords(){
document.getElementById("swordList").innerHTML=swords.map(s=>{
let unlocked=state.swords.includes(s[0])||state.xp>=0;
return `<div class="sword">
<div class="icon">⚔</div><div><b>${s[0]}</b><div class="small">${s[1]}｜${s[2]}</div><div class="small">${s[3]}</div></div></div>`;
}).join("");
}

function renderPeople(){
document.getElementById("peopleList").innerHTML=people.map(p=>`
<div class="sword"><div class="icon">👤</div><div><b>${p[0]}</b><div class="small">${p[1]}</div><div class="small">${p[2]}</div></div></div>`).join("");
}

function daily(){
let q=stages[Math.floor(Math.random()*stages.length)].qs[0];
document.getElementById("dailyBox").innerHTML=`<b>${q[0]}</b><br>答え：<b>${q[1][q[2]]}</b>`;
}

updateHome();
renderStages();
</script>
</body>
</html>
